services:
  # 1. FastAPI Web Application + Benchmarking Engine
  web:
    build: .
    container_name: benchmark_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=benchmark_db

      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
      - MYSQL_DB=benchmark_db

      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=app_user
      - MONGO_PASSWORD=app_password
      - MONGO_DB=benchmark_db

      - MSSQL_HOST=mssql
      - MSSQL_PORT=1433
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=StrongPassword123!
      - MSSQL_DB=benchmark_db

      - ORACLE_HOST=oracle
      - ORACLE_PORT=1521
      - ORACLE_SERVICE=FREEPDB1
      - ORACLE_USER=SYSTEM
      - ORACLE_PASSWORD=OraclePassword123!

      - SQLITE_PATH=/app/data/benchmark.db
    volumes:
      - ./data:/app/data

  # 2. PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: benchmark_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d benchmark_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: benchmark_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword123!
      MYSQL_DATABASE: benchmark_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-papp_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 4. MongoDB 7.0
  mongodb:
    image: mongo:7.0
    container_name: benchmark_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: app_user
      MONGO_INITDB_ROOT_PASSWORD: app_password
      MONGO_INITDB_DATABASE: benchmark_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 5. Microsoft SQL Server 2022
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: benchmark_mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  # 6. Oracle Database 23ai Free
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: benchmark_oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: "OraclePassword123!"
      APP_USER: app_user
      APP_USER_PASSWORD: "app_password"
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  mssql_data:
  oracle_data:
